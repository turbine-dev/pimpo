version: 2
project_name: pimpo

before:
  hooks:
    - make ui

builds:
  - main: ./cmd/pimpo
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    ldflags: -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files: [LICENSE*, NOTICE*, README*]

checksum:
  name_template: checksums.txt

# checksums.txt.sig is the base64 Ed25519 signature of checksums.txt, made
# with the release key (the RELEASE_SIGNING_KEY secret). `pimpo update` and
# scripts/install.sh check it against the public key built into Pimpo
# (docs/RELEASES.md). Without the key the release fails rather than ship
# unsigned; `make release-snapshot` skips signing.
signs:
  - id: checksums
    artifacts: checksum
    cmd: go
    args: ["run", "./cmd/pimpo", "release", "sign", "--key-env", "RELEASE_SIGNING_KEY", "--out", "${signature}", "${artifact}"]
    signature: "${artifact}.sig"
    env:
      - 'RELEASE_SIGNING_KEY={{ index .Env "RELEASE_SIGNING_KEY" }}'

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]

# Homebrew: `brew install turbine-dev/tap/pimpo` installs the command-line
# Pimpo. It is published to the turbine-dev/homebrew-tap repository when
# the release has HOMEBREW_TAP_TOKEN (a token that can push there), and
# skipped otherwise.
homebrew_casks:
  - name: pimpo
    repository:
      owner: turbine-dev
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    homepage: https://github.com/turbine-dev/pimpo
    description: Personal AI agent that learns a task once, then does it on its own
    license: Apache-2.0
    skip_upload: '{{ if or (not (index .Env "HOMEBREW_TAP_TOKEN")) .Prerelease }}true{{ end }}'
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pimpo"]
          end

release:
  github:
    owner: turbine-dev
    name: pimpo
  draft: true
  prerelease: auto
  # Running a release again for the same tag (a re-pushed tag, a retry)
  # replaces its files instead of failing on the ones already there.
  replace_existing_artifacts: true
