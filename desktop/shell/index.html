<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zodim</title>
<style>
  :root { --bg: #fafaf7; --surface: #fff; --ink: #17181b; --ink-2: #4a4d55; --ink-3: #62656c; --line: #e6e6e0; --accent: #4c3ee0; --danger: #b8243c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0f12; --surface: #16181c; --ink: #f2f2ef; --ink-2: #b9bcc4; --ink-3: #8a8f99; --line: #262930; --accent: #8b80ff; --danger: #ff6b81; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; display: grid; place-items: center; padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom); -webkit-user-select: none; user-select: none; }
  main { width: 100%; max-width: 360px; text-align: center; }
  .mark { width: 56px; height: 56px; margin: 0 auto 18px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; }
  p { margin: 0; color: var(--ink-2); font-size: 14px; }
  .pulse { display: inline-flex; gap: 6px; margin-top: 22px; }
  .pulse i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .25; animation: p 1.2s infinite ease-in-out; }
  .pulse i:nth-child(2) { animation-delay: .15s; } .pulse i:nth-child(3) { animation-delay: .3s; }
  @keyframes p { 40% { opacity: 1; transform: translateY(-3px); } }
  form { margin-top: 26px; text-align: left; display: none; }
  label { font-size: 13px; color: var(--ink-2); }
  input { width: 100%; height: 46px; margin-top: 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 14px; font-size: 15px; outline: none; -webkit-user-select: text; user-select: text; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; height: 46px; margin-top: 12px; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 500; }
  .hint { margin-top: 14px; font-size: 12.5px; color: var(--ink-3); }
  .error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 1em; }
  body.mobile .pulse, body.pairing .pulse { display: none; } body.mobile form, body.pairing form { display: block; }
  .secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  #local { display: none; } body.desktop #local { display: block; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5dfc"/><stop offset=".55" stop-color="#4f46e5"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#g)"/><path d="M160 178H328L172 334H352" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/><path d="M378 108c5 27 14 36 41 41-27 5-36 14-41 41-5-27-14-36-41-41 27-5 36-14 41-41Z" fill="#fff"/></svg>
  <h1>Zodim</h1>
  <p id="status">Acordando o seu agente…</p>
  <div class="pulse" aria-hidden="true"><i></i><i></i><i></i></div>
  <form id="pair">
    <label for="link">Link do seu Zodim</label>
    <input id="link" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://zodim.sua-rede.ts.net/auth?token=…">
    <button type="submit">Conectar</button>
    <button type="button" id="local" class="secondary">Usar o Zodim deste computador</button>
    <div class="error" id="error" role="alert"></div>
    <p class="hint" id="hint">O Zodim roda no seu computador ou servidor. No celular, abra Ajustes › Abrir no celular e cole o link aqui.</p>
  </form>
</main>
<script>
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
  const tauri = window.__TAURI__ && window.__TAURI__.core
  const desktop = !mobile && !!tauri && !!window.__ZODIM_DESKTOP__
  const $ = (id) => document.getElementById(id)
  // A link may carry the home address after #home=: it is tried first
  // (fast, and works without internet) and the link is the fallback.
  const reach = (base) => new Promise((ok) => {
    const img = new Image(), t = setTimeout(() => { img.src = ''; ok(false) }, 2500)
    img.onload = () => { clearTimeout(t); ok(true) }
    img.onerror = () => { clearTimeout(t); ok(false) }
    img.src = base + '/favicon.svg?' + Date.now()
  })
  const open = async (link, home) => {
    if (home) {
      const token = new URL(link).searchParams.get('token')
      if (await reach(home)) return location.replace(home + '/auth?token=' + encodeURIComponent(token))
    }
    location.replace(link)
  }
  // parse checks a pasted link the same way on the phone and the desktop.
  const parse = (text) => {
    let url
    try { url = new URL(text.trim()) } catch { throw new Error('Isso não parece um link.') }
    if (url.protocol !== 'https:' && !/^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|100\.)/.test(url.hostname)) throw new Error('Use https: o token não pode viajar em aberto.')
    if (!url.searchParams.get('token')) throw new Error('Falta o token no link.')
    let home = new URLSearchParams(url.hash.slice(1)).get('home')
    if (home && !/^http:\/\/(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)[\d.]+:\d+$/.test(home)) home = null
    url.hash = ''
    return { link: url.href, home: home || '' }
  }
  const pairing = (text) => {
    document.body.classList.add('pairing')
    $('status').textContent = text
  }

  if (mobile) {
    document.body.classList.add('mobile')
    $('status').textContent = 'Conecte ao Zodim que roda no seu computador.'
    let saved = null, savedHome = null
    try { saved = localStorage.getItem('zodim.link'); savedHome = localStorage.getItem('zodim.home') } catch {}
    if (saved) open(saved, savedHome)
  }

  if (desktop) {
    document.body.classList.add('desktop')
    $('hint').textContent = 'Para usar um Zodim de outro computador ou servidor, abra nele Ajustes › Abrir no celular e cole o link aqui. O Zodim deste computador para enquanto isso, para o mesmo robô não responder duas vezes.'
    const connect = async (link, home) => {
      $('status').textContent = 'Conectando ao seu Zodim…'
      const origin = new URL(link).origin
      if ((home && await reach(home)) || await reach(origin)) return open(link, home)
      $('link').value = link
      pairing('Não encontrei o Zodim em ' + new URL(link).host + '. Ele está ligado e na mesma rede ou Tailscale?')
    }
    tauri.invoke('remote').then(([link, home]) => {
      if (location.hash === '#pair') pairing(link ? 'Você está usando o Zodim em ' + new URL(link).host + '.' : 'Conectar a um Zodim em outro computador ou servidor.')
      else if (link) connect(link, home)
    })
    $('local').addEventListener('click', () => {
      document.body.classList.remove('pairing')
      history.replaceState(null, '', location.pathname)
      $('status').textContent = 'Acordando o seu agente…'
      tauri.invoke('use_local').catch((e) => { $('error').textContent = String(e) })
    })
  }

  $('pair').addEventListener('submit', async (e) => {
    e.preventDefault()
    const err = $('error')
    err.textContent = ''
    let p
    try { p = parse($('link').value) } catch (x) { err.textContent = x.message; return }
    if (desktop) {
      if (!(p.home && await reach(p.home)) && !(await reach(new URL(p.link).origin))) { err.textContent = 'Não consegui falar com esse Zodim. Confira o link e a rede.'; return }
      try { await tauri.invoke('use_remote', { link: p.link, home: p.home }) } catch (x) { err.textContent = String(x); return }
    } else {
      try { localStorage.setItem('zodim.link', p.link); p.home ? localStorage.setItem('zodim.home', p.home) : localStorage.removeItem('zodim.home') } catch {}
    }
    open(p.link, p.home)
  })
</script>
</body>
</html>
