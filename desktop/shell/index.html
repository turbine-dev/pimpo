<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vigia</title>
<style>
  :root { --bg: #fafaf7; --surface: #fff; --ink: #17181b; --ink-2: #4a4d55; --ink-3: #62656c; --line: #e6e6e0; --accent: #4c3ee0; --danger: #b8243c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0f12; --surface: #16181c; --ink: #f2f2ef; --ink-2: #b9bcc4; --ink-3: #8a8f99; --line: #262930; --accent: #8b80ff; --danger: #ff6b81; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; display: grid; place-items: center; padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom); -webkit-user-select: none; user-select: none; }
  main { width: 100%; max-width: 360px; text-align: center; }
  .mark { width: 56px; height: 56px; margin: 0 auto 18px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; }
  p { margin: 0; color: var(--ink-2); font-size: 14px; }
  .pulse { display: inline-flex; gap: 6px; margin-top: 22px; }
  .pulse i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .25; animation: p 1.2s infinite ease-in-out; }
  .pulse i:nth-child(2) { animation-delay: .15s; } .pulse i:nth-child(3) { animation-delay: .3s; }
  @keyframes p { 40% { opacity: 1; transform: translateY(-3px); } }
  form { margin-top: 26px; text-align: left; display: none; }
  label { font-size: 13px; color: var(--ink-2); }
  input { width: 100%; height: 46px; margin-top: 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 14px; font-size: 15px; outline: none; -webkit-user-select: text; user-select: text; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; height: 46px; margin-top: 12px; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 500; }
  .hint { margin-top: 14px; font-size: 12.5px; color: var(--ink-3); }
  .error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 1em; }
  body.mobile .pulse { display: none; } body.mobile form { display: block; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7dff"/><stop offset="1" stop-color="#5b8cff"/></linearGradient></defs><rect width="512" height="512" rx="120" fill="url(#g)"/><path d="M112 272c38-67 86-101 144-101s106 34 144 101c-38 67-86 101-144 101s-106-34-144-101Z" fill="none" stroke="#fff" stroke-width="30" stroke-linejoin="round"/><circle cx="256" cy="272" r="42" fill="#fff"/></svg>
  <h1>Vigia</h1>
  <p id="status">Acordando o seu agente…</p>
  <div class="pulse" aria-hidden="true"><i></i><i></i><i></i></div>
  <form id="pair">
    <label for="link">Link do seu Vigia</label>
    <input id="link" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://vigia.sua-rede.ts.net/auth?token=…">
    <button type="submit">Conectar</button>
    <div class="error" id="error" role="alert"></div>
    <p class="hint">O Vigia roda no seu computador ou servidor. No celular, abra Ajustes › Abrir no celular e cole o link aqui.</p>
  </form>
</main>
<script>
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
  if (mobile) {
    document.body.classList.add('mobile')
    document.getElementById('status').textContent = 'Conecte ao Vigia que roda no seu computador.'
    // A link may carry the home address after #home=: the phone tries it
    // first (fast, and works without internet) and falls back to the link.
    const reach = (base) => new Promise((ok) => {
      const img = new Image(), t = setTimeout(() => { img.src = ''; ok(false) }, 1500)
      img.onload = () => { clearTimeout(t); ok(true) }
      img.onerror = () => { clearTimeout(t); ok(false) }
      img.src = base + '/favicon.svg?' + Date.now()
    })
    const open = async (link, home) => {
      if (home) {
        const token = new URL(link).searchParams.get('token')
        if (await reach(home)) return location.replace(home + '/auth?token=' + encodeURIComponent(token))
      }
      location.replace(link)
    }
    let saved = null, savedHome = null
    try { saved = localStorage.getItem('vigia.link'); savedHome = localStorage.getItem('vigia.home') } catch {}
    if (saved) open(saved, savedHome)
    document.getElementById('pair').addEventListener('submit', (e) => {
      e.preventDefault()
      const err = document.getElementById('error')
      let url
      try { url = new URL(document.getElementById('link').value.trim()) } catch { err.textContent = 'Isso não parece um link.'; return }
      if (url.protocol !== 'https:' && !/^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|100\.)/.test(url.hostname)) { err.textContent = 'Use https: o token não pode viajar em aberto.'; return }
      if (!url.searchParams.get('token')) { err.textContent = 'Falta o token no link.'; return }
      let home = new URLSearchParams(url.hash.slice(1)).get('home')
      if (home && !/^http:\/\/(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)[\d.]+:\d+$/.test(home)) home = null
      url.hash = ''
      try { localStorage.setItem('vigia.link', url.href); home ? localStorage.setItem('vigia.home', home) : localStorage.removeItem('vigia.home') } catch {}
      open(url.href, home)
    })
  }
</script>
</body>
</html>
