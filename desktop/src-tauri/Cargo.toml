[package]
name = "pimpo-desktop"
version = "0.5.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
name = "pimpo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
getrandom = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde_json = "1"

# The lock asks the system for Touch ID (LocalAuthentication) or Windows
# Hello; both crates are already in the tree through Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Security_Credentials_UI", "Foundation"] }

# No LTO or stripping: with them the iOS release build shows a blank page.
