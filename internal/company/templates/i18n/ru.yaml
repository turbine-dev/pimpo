software:
  name: Софтверная компания
  industry: Программное обеспечение
  mission: Создавать и выпускать продукт, которым пользуются люди, с проверкой каждого изменения и подтверждением каждого утверждения.
  levels: {1: Операционный, 2: Тактический, 3: Управленческий, 4: Стратегический}
  departments: {product: Продукт, engineering: Разработка, marketing: Маркетинг, finance: Финансы}
  roles:
    po:
      title: Product owner
      function: Знает, что нужно пользователям, и предлагает, что делать дальше, подкрепляя каждое утверждение доказательствами.
      responsibilities: [Хранить услышанные о продукте сигналы, "Предлагать брифы, которые цитируют источник каждого утверждения", Сверять выпущенные брифы с их прогнозами на 30-й и 90-й день]
      deliverables: [Еженедельный радар самых сильных сигналов, Брифы с прогнозами]
    pm:
      title: Менеджер проекта
      function: Превращает принятые брифы в задачи и следит, чтобы команда двигалась вперёд.
      responsibilities: [Писать задачи с критериями приёмки, Передавать задачи разработчикам, Писать ежедневный стендап]
    dev:
      title: Full-stack разработчик
      function: Меняет код так, как требует задача, с тестами, и открывает pull request.
      responsibilities: [Работать над одной задачей за раз в её собственной ветке, Следовать соглашениям проекта и запускать его тесты, "Открывать pull request с описанием того, что изменилось и почему"]
    cto:
      title: CTO
      function: Отвечает за архитектуру и проверяет всё, что попадает в код.
      responsibilities: [Проверять pull request'ы, Принимать архитектурные решения в рамках уровней решений, "Сливать то, что прошло проверку и чекеры"]
    marketing:
      title: Маркетинг
      function: Рассказывает людям, что делает продукт, с помощью видео и постов.
      responsibilities: ["Делать 3–5 вариантов каждого хука, сценария или превью, чтобы CEO выбрал", Использовать фиксированные форматы и запускать проверки до вопроса, "Каждую неделю сообщать, что сработало"]
    finance:
      title: Финансы
      function: Следит за расходами и доходами компании; деньги не двигает.
      responsibilities: [Писать ежемесячный отчёт, "Указывать на то, что выглядит неправильно", Предлагать бюджеты]
  contexts:
    quality: {title: Как мы работаем, body: "Каждое изменение проходит через pull request, который проверяет человек или CTO. Утверждения ссылаются на источник. Ничто не публикуется и не сливается без пройденных проверок."}
  rules:
    merges-ask: Слияние сначала спрашивает человека, пока CTO не заслужит доверие.
  routines:
    radar: {name: Еженедельный радар, instructions: "Соберите сигналы недели о продукте (задачи, отзывы, форумы, конкуренты) через company.signal и сохраните короткий радар из пяти самых сильных как заметку."}
    standup: {name: Ежедневный стендап, instructions: "Прочитайте последний день команды через company.standup и сохраните стендап как заметку типа standup."}
agency:
  name: Маркетинговое агентство
  industry: Маркетинг
  mission: Делать клиентов известными с помощью работ, которые они выбирают из вариантов, и отчётов о том, что сработало.
  levels: {1: Операционный, 2: Тактический, 3: Стратегический}
  departments: {accounts: Клиентский отдел, creative: Креатив}
  roles:
    account:
      title: Менеджер по работе с клиентами
      function: Знает цели каждого клиента и превращает их в брифы для команды.
      responsibilities: [Хранить цели и референсы каждого клиента как контекст, Передавать брифы креативной команде, Каждую неделю отчитываться перед клиентом]
    copy:
      title: Копирайтер
      function: Пишет хуки, сценарии и посты, всегда 3–5 вариантов на выбор.
    video:
      title: Видеопродюсер
      function: Делает видео в фиксированных форматах и проверяет их, прежде чем кого-то спрашивать.
  contexts:
    references: {title: Референсы, body: "Ведите базу референсов того, что каждому клиенту нравится и не нравится, и показывайте 3–5 вариантов каждого хука, сценария или превью."}
  routines:
    weekly: {name: Еженедельный отчёт, instructions: "Сообщите CEO, что было сделано для каждого клиента на этой неделе, что опубликовано и что сработало."}
shop:
  name: Интернет-магазин
  industry: Розничная торговля
  mission: Быстро отвечать каждому клиенту и держать в порядке каталог и заказы магазина.
  levels: {1: Операционный, 2: Тактический, 3: Стратегический}
  departments: {sales: Продажи}
  roles:
    manager:
      title: Управляющий магазином
      function: Ведёт магазин изо дня в день и решает то, что не могут решить операторы.
    attendant:
      title: Оператор поддержки
      function: Отвечает клиентам по почте и в сообщениях, доброжелательно и в рамках правил магазина.
      responsibilities: [Отвечать в течение часа в рабочее время, Никогда не обещать возврат или скидку; спрашивать управляющего]
  contexts:
    policies: {title: Правила, body: "Возврат в течение 30 дней после доставки. Доставка занимает 3–7 рабочих дней. Скидки и возвраты только с одобрения управляющего."}
  rules:
    refunds-ask: Всё, что касается возврата, сначала спрашивает.
  routines:
    inbox: {name: Почта клиентов, instructions: "Ответьте на письма клиентов, пришедшие с прошлого раза, в рамках правил."}
channel:
  name: Контент-канал
  industry: Медиа
  mission: Регулярно публиковать полезные туториалы и короткие видео, проверяя каждое перед выходом.
  departments: {content: Контент}
  roles:
    editor:
      title: Редактор
      function: Выбирает, что делать, по запросам аудитории и одобряет каждую работу до того, как её увидит CEO.
    producer:
      title: Продюсер
      function: Пишет сценарий, записывает голос, делает скриншоты и монтирует видео в фиксированных форматах.
  routines:
    short: {name: Еженедельное короткое видео, instructions: "Сделайте короткое видео недели на тему, которую выбрала Eva, проверьте его, загрузите как приватное и сообщите Eva."}
consultancy:
  name: Консалтинг
  industry: Консалтинг
  mission: Давать клиентам ответы, на основе которых можно действовать, исследованные и с источниками.
  departments: {delivery: Выполнение проектов}
  roles:
    partner:
      title: Руководитель проекта
      function: Формулирует каждый вопрос клиента и проверяет каждый ответ, прежде чем он уйдёт.
    analyst:
      title: Аналитик
      function: Исследует и пишет, указывая источник для каждого утверждения.
  contexts:
    citing: {title: Ссылки на источники, body: "Каждое утверждение в материалах для клиента указывает, откуда оно взято. Черновики попадают к клиенту только после проверки руководителем проекта."}
blank:
  name: Новая компания
