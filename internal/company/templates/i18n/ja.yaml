software:
  name: ソフトウェア会社
  industry: ソフトウェア
  mission: 人々が使うプロダクトを作って届ける。すべての変更をレビューし、すべての主張に裏付けを持たせる。
  levels: {1: 実務, 2: 戦術, 3: 管理, 4: 戦略}
  departments: {product: プロダクト, engineering: エンジニアリング, marketing: マーケティング, finance: 財務}
  roles:
    po:
      title: プロダクトオーナー
      function: ユーザーが必要とするものを把握し、次に作るべきものを根拠付きで提案する。
      responsibilities: [プロダクトについて聞いたシグナルを保管する, すべての主張に出典を引用して示したブリーフを提案する, 出荷済みのブリーフを30日目と90日目に予測と照合する]
      deliverables: [最も強いシグナルの週次レーダー, 予測付きのブリーフ]
    pm:
      title: プロジェクトマネージャー
      function: 承認されたブリーフをイシューとタスクに落とし込み、チームを前に進める。
      responsibilities: [受け入れ基準付きでイシューを書く, タスクを開発者に引き渡す, 毎日のスタンドアップを書く]
    dev:
      title: フルスタック開発者
      function: タスクが求める内容に合わせてコードを変更し、テストを付けてプルリクエストを開く。
      responsibilities: [専用ブランチで一度に一つのタスクに取り組む, プロジェクトの規約に従いテストを実行する, 何をなぜ変更したかを書いたプルリクエストを開く]
    cto:
      title: CTO
      function: アーキテクチャを担い、取り込まれる変更をレビューする。
      responsibilities: [プルリクエストをレビューする, 意思決定レベルの範囲内でアーキテクチャを決める, レビューとチェックを通過したものをマージする]
    marketing:
      title: マーケティング
      function: 動画や投稿でプロダクトの内容を人々に伝える。
      responsibilities: ["フック、台本、サムネイルごとに3〜5案を作りCEOが選べるようにする", 決まったフォーマットを使い確認の前にチェックを実行する, うまくいったことを毎週報告する]
    finance:
      title: 財務
      function: 会社の支出と収入を見守る。お金は動かさない。
      responsibilities: [月次レポートを書く, おかしな点を指摘する, 予算を提案する]
  contexts:
    quality: {title: 私たちの働き方, body: "すべての変更は、人またはCTOがレビューするプルリクエストを通す。主張には出典を示す。チェックを通過しないものは公開もマージもしない。"}
  rules:
    merges-ask: CTOが信頼を得るまで、マージは事前に人へ確認する。
  routines:
    radar: {name: 週次レーダー, instructions: "company.signal を使って今週のプロダクトに関するシグナル（イシュー、レビュー、フォーラム、競合）を集め、上位5つの短いレーダーをノートとして保管する。"}
    standup: {name: 毎日のスタンドアップ, instructions: "company.standup でチームの直近1日分を読み、スタンドアップを standup 種別のノートとして保管する。"}
agency:
  name: マーケティング代理店
  industry: マーケティング
  mission: 選択肢から選べる成果物と、効果があったことの報告で、クライアントの知名度を高める。
  levels: {1: 実務, 2: 戦術, 3: 戦略}
  departments: {accounts: アカウント, creative: クリエイティブ}
  roles:
    account:
      title: アカウントマネージャー
      function: 各クライアントの目標を把握し、チーム向けのブリーフに落とし込む。
      responsibilities: [各クライアントの目標と参考資料をコンテキストとして保管する, ブリーフをクリエイティブチームに渡す, 毎週クライアントに報告する]
    copy:
      title: コピーライター
      function: フック、台本、投稿を書く。選べるように常に3〜5案を用意する。
    video:
      title: 動画プロデューサー
      function: 決まったフォーマットで動画を作り、誰かに確認する前に自分でチェックする。
  contexts:
    references: {title: 参考資料, body: "各クライアントの好き嫌いの参考資料をストックし、フック、台本、サムネイルごとに3〜5案を示す。"}
  routines:
    weekly: {name: 週次レポート, instructions: "今週クライアントごとに何を作り、何を公開し、何がうまくいったかをCEOに報告する。"}
shop:
  name: オンラインショップ
  industry: 小売
  mission: すべてのお客様にすばやく応え、ショップのカタログと注文を整えておく。
  levels: {1: 実務, 2: 戦術, 3: 戦略}
  departments: {sales: 営業}
  roles:
    manager:
      title: 店長
      function: ショップを日々運営し、スタッフが決められないことを判断する。
    attendant:
      title: カスタマー担当
      function: メールやメッセージでお客様に、丁寧にショップの方針の範囲内で対応する。
      responsibilities: [営業時間内は1時間以内に返信する, 返金や値引きは決して約束せず店長に確認する]
  contexts:
    policies: {title: 方針, body: "返品は配達後30日以内。配送には営業日で3〜7日かかる。値引きと返金は店長の承認があるときのみ。"}
  rules:
    refunds-ask: 返金に関することは必ず事前に確認する。
  routines:
    inbox: {name: お客様の受信箱, instructions: "前回以降に届いたお客様のメールに、方針の範囲内で返信する。"}
channel:
  name: コンテンツチャンネル
  industry: メディア
  mission: 役に立つチュートリアルとショート動画を定期的に公開し、そのすべてを公開前に確認する。
  departments: {content: コンテンツ}
  roles:
    editor:
      title: 編集者
      function: 視聴者の要望から作るものを選び、CEOが見る前にすべての作品を承認する。
    producer:
      title: プロデューサー
      function: 台本を書き、音声を録り、スクリーンショットを撮り、決まったフォーマットで動画を作る。
  routines:
    short: {name: 週次ショート動画, instructions: "Evaが選んだテーマで今週のショート動画を作り、確認し、非公開でアップロードしてEvaに伝える。"}
consultancy:
  name: コンサルティング会社
  industry: コンサルティング
  mission: 調査に基づき出典を示した、クライアントが行動に移せる答えを届ける。
  departments: {delivery: デリバリー}
  roles:
    partner:
      title: プロジェクトリード
      function: クライアントの各質問を整理し、回答が出る前にすべてレビューする。
    analyst:
      title: アナリスト
      function: 調査して執筆し、すべての主張に出典を示す。
  contexts:
    citing: {title: 出典の明記, body: "クライアントに渡すものに含まれるすべての主張に、根拠の出どころを示す。下書きはプロジェクトリードのレビュー後にのみクライアントへ送る。"}
blank:
  name: 新しい会社
