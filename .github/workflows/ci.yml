name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: cd ui && npm ci --no-audit --no-fund && npx vite build
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: cd ui && npm ci --no-audit --no-fund && npx tsc -b && npx vitest run

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: make build
      - run: cd ui && npx playwright install --with-deps chromium && npx playwright test

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - uses: goreleaser/goreleaser-action@v7
        with: { args: build --snapshot --clean }

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: mkdir -p desktop/src-tauri/binaries && touch desktop/src-tauri/binaries/pimpo-aarch64-apple-darwin
      - run: cd desktop/src-tauri && cargo clippy -- -D warnings
