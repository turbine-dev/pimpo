name: desktop

# Builds the desktop app for macOS (Apple Silicon and Intel), Windows and
# Linux (x64 and arm64). Each run keeps the installers as workflow
# artifacts; a release (see release.yml) also attaches them to the draft
# release of its tag.
#
# macOS builds are signed and notarized when the APPLE_* secrets are set,
# and signed ad hoc otherwise (the app then opens with right-click › Open).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) whose version the app takes and whose draft release gets the installers
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple Silicon), os: macos-latest, target: aarch64-apple-darwin, goos: darwin, goarch: arm64, bundles: "app,dmg" }
          - { name: macOS (Intel), os: macos-latest, target: x86_64-apple-darwin, goos: darwin, goarch: amd64, bundles: "app,dmg" }
          - { name: Windows (x64), os: windows-latest, target: x86_64-pc-windows-msvc, goos: windows, goarch: amd64, ext: .exe, bundles: "nsis,msi" }
          - { name: Linux (x64), os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, goos: linux, goarch: amd64, bundles: "deb,rpm,appimage" }
          - { name: Linux (arm64), os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, goos: linux, goarch: arm64, bundles: "deb,rpm,appimage" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The build only reads: the attach job uploads the installers.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release builds exactly the tagged commit.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: "ui/package-lock.json" }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: "desktop/src-tauri -> target", key: "${{ matrix.target }}" }

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file rpm xdg-utils

      - name: Version
        id: version
        shell: bash
        env: { TAG: "${{ inputs.tag }}" }
        run: |
          tag="$TAG"
          if [ -n "$tag" ]; then
            version="${tag#v}"
            # The app takes the tag's whole version, which updates compare;
            # the MSI only accepts x.y.z, so it gets the version without -beta.N.
            node -e 'const f="desktop/src-tauri/tauri.conf.json",fs=require("fs"),c=JSON.parse(fs.readFileSync(f)),v=process.argv[1];c.version=v;c.bundle.windows={...(c.bundle.windows||{}),wix:{...((c.bundle.windows||{}).wix||{}),version:v.split("-")[0]}};fs.writeFileSync(f,JSON.stringify(c,null,2)+"\n")' "$version"
          else
            version="$(node -p 'require("./desktop/src-tauri/tauri.conf.json").version')-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Web app
        run: cd ui && npm ci --no-audit --no-fund && npx vite build

      # Installed before any signing secret is in the environment.
      - name: Desktop dependencies
        run: cd desktop && npm ci --no-audit --no-fund

      - name: Server sidecar
        shell: bash
        env: { CGO_ENABLED: "0", GOOS: "${{ matrix.goos }}", GOARCH: "${{ matrix.goarch }}", VERSION: "${{ steps.version.outputs.version }}", TARGET: "${{ matrix.target }}", EXT: "${{ matrix.ext }}" }
        run: |
          mkdir -p desktop/src-tauri/binaries
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o "desktop/src-tauri/binaries/pimpo-$TARGET$EXT" ./cmd/pimpo

      # Windows installers are signed when the repository has a code-signing
      # certificate (a .pfx, base64) and its password.
      - name: Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "no certificate: Windows installers stay unsigned"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "WINDOWS_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Desktop app
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          # Unset what is empty, so a fork without secrets still builds.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ "$RUNNER_OS" = macOS ] && [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            export APPLE_SIGNING_IDENTITY=-   # ad hoc: Apple Silicon refuses unsigned apps
          fi
          cd desktop
          # With the updater's key, the bundles the updater installs are
          # made and signed too.
          extra=()
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            extra+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          if [ -n "${WINDOWS_THUMBPRINT:-}" ]; then
            extra+=(--config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$WINDOWS_THUMBPRINT\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}")
          fi
          npx tauri build --ci --target "$TARGET" --bundles "$BUNDLES" "${extra[@]}"

      - name: Collect installers
        id: collect
        shell: bash
        env: { TARGET: "${{ matrix.target }}", VERSION: "${{ steps.version.outputs.version }}", ARCH: "${{ matrix.goarch }}" }
        run: |
          out="$RUNNER_TEMP/installers"
          mkdir -p "$out"
          bundle="desktop/src-tauri/target/$TARGET/release/bundle"
          v="$VERSION"
          arch="$ARCH"
          shopt -s nullglob
          for f in "$bundle"/dmg/*.dmg; do cp "$f" "$out/Pimpo_${v}_macos_${arch}.dmg"; done
          # The updater's own archive of the app, signed, when it was made.
          for f in "$bundle"/macos/*.app.tar.gz; do cp "$f" "$out/Pimpo_${v}_macos_${arch}.app.tar.gz"; done
          for f in "$bundle"/macos/*.app.tar.gz.sig; do cp "$f" "$out/Pimpo_${v}_macos_${arch}.app.tar.gz.sig"; done
          if [ ! -e "$out/Pimpo_${v}_macos_${arch}.app.tar.gz" ]; then
            for d in "$bundle"/macos/*.app; do (cd "$(dirname "$d")" && tar -czf "$out/Pimpo_${v}_macos_${arch}.app.tar.gz" "$(basename "$d")"); done
          fi
          for f in "$bundle"/nsis/*.exe; do cp "$f" "$out/Pimpo_${v}_windows_${arch}_setup.exe"; done
          for f in "$bundle"/nsis/*.exe.sig; do cp "$f" "$out/Pimpo_${v}_windows_${arch}_setup.exe.sig"; done
          for f in "$bundle"/msi/*.msi; do cp "$f" "$out/Pimpo_${v}_windows_${arch}.msi"; done
          for f in "$bundle"/deb/*.deb; do cp "$f" "$out/Pimpo_${v}_linux_${arch}.deb"; done
          for f in "$bundle"/rpm/*.rpm; do cp "$f" "$out/Pimpo_${v}_linux_${arch}.rpm"; done
          for f in "$bundle"/appimage/*.AppImage; do cp "$f" "$out/Pimpo_${v}_linux_${arch}.AppImage"; done
          for f in "$bundle"/appimage/*.AppImage.sig; do cp "$f" "$out/Pimpo_${v}_linux_${arch}.AppImage.sig"; done
          ls -la "$out"
          [ -n "$(ls -A "$out")" ] || { echo "no installers were built" >&2; exit 1; }
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pimpo-desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.collect.outputs.dir }}/*
          if-no-files-found: error
          retention-days: 14

  # The installers that were built go to the draft release, even when
  # another system's build failed.
  attach:
    needs: build
    if: ${{ !cancelled() && inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the installers: the same run also holds the Docker build record
      # (*.dockerbuild), which download-artifact cannot extract.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: installers, pattern: "pimpo-desktop-*", merge-multiple: true }
      - name: Attach to the draft release
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.tag }}" }
        run: gh release upload "$TAG" installers/* --clobber --repo "$GITHUB_REPOSITORY"

  # The updater's manifest, once every system is built, attached to the
  # draft release. Nothing points users at it yet: publish.yml moves
  # channel-beta, Homebrew and winget when the release is published, so
  # nobody is sent to files a draft still hides.
  manifest:
    needs: [build, attach]
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: installers, pattern: "pimpo-desktop-*", merge-multiple: true }
      - name: latest.json
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.tag }}" }
        run: |
          if ! ls installers/*.sig >/dev/null 2>&1; then
            echo "::warning::no updater signatures: set the TAURI_SIGNING_PRIVATE_KEY secrets for automatic updates"
            exit 0
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md || true
          python3 scripts/latest-json.py installers "$GITHUB_REPOSITORY" "$TAG" notes.md > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
