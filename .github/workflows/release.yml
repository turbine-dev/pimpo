name: release

# A release runs when a vX.Y.Z tag is pushed, or by hand from
# Actions › release › Run workflow, which tags the chosen branch first.
# Either way it ends in a draft release that a maintainer checks and
# publishes (docs/RELEASES.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as vX.Y.Z (or vX.Y.Z-beta.N). The branch chosen above is tagged with it."
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - id: tag
        name: Tag
        shell: bash
        env: { VERSION: "${{ inputs.version }}" }
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
            echo "::error::version must look like v1.2.3 or v1.2.3-beta.1, got '$VERSION'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null || git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION already exists; choose a new version"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Pimpo $VERSION"
          # Pushed with the workflow's token, the tag does not start this
          # workflow a second time.
          git push origin "refs/tags/$VERSION"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

  binaries:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "refs/tags/${{ needs.tag.outputs.tag }}" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc }
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with: { args: release --clean }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    needs: [tag, binaries]
    permissions:
      contents: write # attaches the installers and latest.json
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  docker:
    needs: [tag, binaries]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

