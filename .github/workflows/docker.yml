name: docker

# The server image, for amd64 and arm64, at ghcr.io/turbine-dev/pimpo:
# "edge" follows main, a release adds its version and, when it is not a
# pre-release, "latest".

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "desktop/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: docker-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        shell: bash
        env: { TAG: "${{ inputs.tag }}" }
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          if [ -n "$TAG" ]; then
            version=${TAG#v}
            tags="$image:$version"
            case "$version" in *-*) ;; *) tags="$tags,$image:latest" ;; esac
          else
            version="edge-$(git rev-parse --short HEAD)"
            tags="$image:edge"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Pimpo, a personal AI agent that learns a task once and then does it on its own
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
