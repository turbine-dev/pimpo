version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly }
    groups:
      ui: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      # Node's types follow the Node that runs Pimpo (.nvmrc), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: monthly }
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: monthly }
    groups:
      tauri: { patterns: ["tauri*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
